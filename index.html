  // Track which app a visitor clicks through to (GA4 portal property).
  // Generic: applies to every .link-card, so new app cards are tracked automatically.
  document.querySelectorAll('.link-card').forEach(function (a) {
    a.addEventListener('click', function () {
      if (!window.gtag) return;
      var t = a.querySelector('.link-title');
